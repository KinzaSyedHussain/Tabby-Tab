<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabby Tab</title>
</head>
  <body>
    <div class="container">
      <div id="clock" class="clock">02:40:00</div>
      <div id="date" class="date">Loading date...</div>

      <form action="https://www.google.com/search" method="GET" class="search-box">
        <input type="text" name="q" placeholder="Search the web..." autofocus autocomplete="off"/>
      </form>
      <div class="background">
        <label for="bg-color" class="bg-btn" title="Change Color" onclick="document.getElementById('bg-color').click()">Color</label>
        <input type="color" id="bg-color" value="#09090b" style="display: none;" />
        <label for="bg-upload" class="bg-btn" title="Change Background">Change Background</label>
        <input type="file" id="bg-upload" accept="image/*" style="display: none;">
      </div>


    <script type="module" src="/src/main.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </body>
</html>
